services:
  # Opt-in, and deliberately not part of `docker compose up -d`: that is
  # documented as starting MongoDB and Redis only, and the server is normally
  # run on the host with `go run ./cmd/server` or `air`. Starting both would
  # bind INDRI_LISTEN_PORT twice and the host process would fail to listen.
  #
  # Run this one with: docker compose --profile server up -d
  server:
    profiles: ["server"]
    build: .
    env_file:
      - .env
    environment:
      # Force this regardless of .env: the Dockerfile's own ENV sets the same
      # override, but env_file above is applied after the image's ENV and
      # would otherwise silently win, leaving the server bound to loopback
      # and unreachable through the port mapping below.
      - INDRI_LISTEN_ADDRESS=0.0.0.0
    ports:
      - "${INDRI_LISTEN_PORT:-5002}:${INDRI_LISTEN_PORT:-5002}"
      # The WebRTC UDP mux binds one fixed port and advertises it verbatim in
      # ICE candidates, so host and container port MUST be identical here --
      # a remapped port (e.g. "9000:8443") would advertise 8443 to clients
      # while only 9000 is reachable. Without this mapping at all, ICE
      # gathering just produces unreachable candidates: the signalling POST
      # still returns 200 with a normal-looking SDP answer, and nothing at
      # the HTTP layer indicates the DataChannel will never open.
      - "${INDRI_RTC_UDP_PORT:-8443}:${INDRI_RTC_UDP_PORT:-8443}/udp"
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:latest
    env_file:
      - .env
    ports:
      - "${INDRI_MONGO_PORT:-27017}:27017"
    # Standalone MongoDB — no replica set. Real-time change deltas are computed
    # and published by the application (see internal/services/events), so the
    # oplog/change-stream (which requires a replica set) is no longer needed.
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - "mongodb_data:/data/db"

  redis:
    image: 'bitnami/redis:latest'
    environment:
      - REDIS_PASSWORD=${INDRI_REDIS_PASSWORD}
      # Local development stack only: INDRI_REDIS_PASSWORD is empty by default,
      # and bitnami/redis refuses to start with an empty password unless this is
      # set. Do not reuse this compose file for a deployment.
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - '${INDRI_REDIS_PORT:-6379}:6379'

  # Opt-in, like the server above: MongoDB is the default backend, so a plain
  # `docker compose up -d` should not pay for a Postgres nobody asked for.
  # Start it with: docker compose --profile postgres up -d
  #
  # The Postgres-backed store tests skip unless INDRI_TEST_POSTGRES_URI is set,
  # so this is what makes them run:
  #   INDRI_TEST_POSTGRES_URI=postgres://indri:indri@localhost:5432/indri?sslmode=disable
  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${INDRI_POSTGRES_USER:-indri}
      - POSTGRES_PASSWORD=${INDRI_POSTGRES_PASSWORD:-indri}
      - POSTGRES_DB=${INDRI_POSTGRES_DB:-indri}
    ports:
      - '${INDRI_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INDRI_POSTGRES_USER:-indri} -d ${INDRI_POSTGRES_DB:-indri}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

volumes:
  mongodb_data:
  postgres_data:
