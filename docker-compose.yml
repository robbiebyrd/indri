services:
  mongodb:
    image: mongo:latest
    env_file:
      - .env
    ports:
      - "${INDRI_MONGO_PORT:-27017}:27017"
    # Standalone MongoDB — no replica set. Real-time change deltas are computed
    # and published by the application (see internal/services/events), so the
    # oplog/change-stream (which requires a replica set) is no longer needed.
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - "mongodb_data:/data/db"

  redis:
    image: 'bitnami/redis:latest'
    environment:
      - REDIS_PASSWORD=${INDRI_REDIS_PASSWORD}
      - ALLOW_EMPTY_PASSWORD=${INDRI_REDIS_EMPTY_PASSWORD:-no}
    ports:
      - '${INDRI_REDIS_PORT:-6379}:6379'

volumes:
  mongodb_data:
