name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, vet & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: indri
          POSTGRES_PASSWORD: indri
          POSTGRES_DB: indri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indri -d indri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the Postgres integration tests, which skip when this is unset.
      INDRI_TEST_POSTGRES_URI: postgres://indri:indri@localhost:5432/indri?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  client:
    name: Client typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
