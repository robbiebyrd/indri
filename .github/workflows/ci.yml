name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, vet & test
    runs-on: ubuntu-latest

    # The suite is designed to pass with no database: every store has an
    # in-memory backend and SQLite needs no server, and every rule they own is
    # asserted against both. MongoDB and PostgreSQL are here for the layer a
    # fake cannot stand in for — that a conditional write really fences on the
    # version, that a row lock really serialises a read-modify-write, that a
    # unique index really refuses the second account. Without the services
    # those subtests skip, and a broken fence would ship unnoticed.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: indri
          POSTGRES_PASSWORD: indri
          POSTGRES_DB: indri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indri -d indri"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          INDRI_TEST_MONGO_URI: mongodb://localhost:27017/?directConnection=true
          INDRI_TEST_POSTGRES_URI: postgres://indri:indri@localhost:5432/indri?sslmode=disable
        run: go test -race ./...

      # The suite must not depend on the services above. With MongoDB pointed
      # at a port nothing listens on and no PostgreSQL URI, every assertion
      # still has to run: only "/mongodb" and "/postgres" subtests may skip,
      # and a skip anywhere else means a test has gone back to reporting green
      # without executing.
      #
      # This runs over ./... rather than named packages on purpose. Scoping it
      # to the packages that happen to have fakes today would let the next
      # package reintroduce the very rot this step exists to catch, silently.
      # A new skip fails CI and has to be either fixed or added below with a
      # reason.
      #
      # KNOWN_SKIPS is the exception list, one test per line. Each is a test of
      # a database client itself, which has nothing to fall back to:
      #   TestOpen_CapsOpenConnections — the PostgreSQL pool cap, against a
      #   real server.
      #   TestOpenStores_MongoDBUsesMongoForEverything — INDRI_DB_BACKEND=
      #   mongodb wiring, which needs a MongoDB to connect to.
      - name: Tests run without a database
        env:
          INDRI_TEST_MONGO_URI: mongodb://127.0.0.1:1/
          KNOWN_SKIPS: |-
            TestOpen_CapsOpenConnections
            TestOpenStores_MongoDBUsesMongoForEverything
        run: |
          go test -json ./... > results.json
          unexpected=$(jq -r 'select(.Action == "skip" and .Test != null) | .Test' results.json \
            | grep -v '/mongodb$' \
            | grep -v '/postgres$' \
            | grep -vxF "$KNOWN_SKIPS" || true)
          if [ -n "$unexpected" ]; then
            echo "These tests skipped with no database available:"
            echo "$unexpected"
            echo
            echo "A skipped test reports green without running. Give the package"
            echo "an in-memory backend, or add the test to KNOWN_SKIPS with a reason."
            exit 1
          fi

  client:
    name: Client typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
