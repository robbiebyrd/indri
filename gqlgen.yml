schema:
  - internal/transport/graphql/schema.graphqls

exec:
  filename: internal/transport/graphql/generated/generated.go
  package: generated

model:
  filename: internal/transport/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/transport/graphql/resolvers
  package: resolvers
  filename_template: "{name}.resolvers.go"

omit_slice_element_pointers: true
struct_tag: json

models:
  JSON:
    model:
      - github.com/robbiebyrd/indri/internal/transport/graphql/model.JSON
